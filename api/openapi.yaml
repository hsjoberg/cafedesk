openapi: 3.0.3
info:
  title: Cafedesk API
  version: 0.11.0
  description: |
    The contract between the Cafedesk server, the POS terminals and the admin.

    The admin signs in with an email and password and gets a session cookie
    (`cafedesk_session`: HttpOnly, Secure, SameSite=Lax). Requests that change
    data must be JSON and come from the admin's own origin.

    Money is in fils (1 AED = 100 fils), as integers. IDs are UUIDs. Errors have
    an `error` object with a `code` a program can check and a `message` a person
    can read.

    A till (terminal) is paired once with a code shown in the admin, and then
    sends its device token as `Authorization: Bearer <token>`. It pulls the menu
    and its shop's staff with `/v1/terminal/changes`, and sends what happened on
    it (business days, orders, voids, refunds, PIN changes) with
    `/v1/terminal/events`. Both are safe to repeat: events are applied once, by
    their IDs.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://{service}.up.railway.app
    description: Railway
    variables:
      service:
        default: cafedesk-server

security:
  - session: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness check, polled by Railway.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string

  /v1/ping:
    get:
      operationId: ping
      summary: Confirms a client can reach the API, and reports its version and clock.
      security: []
      responses:
        "200":
          description: The server answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"

  /v1/admin/session:
    post:
      operationId: signIn
      summary: Signs in to the admin, setting the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      operationId: signOut
      summary: Signs out, ending the session.
      responses:
        "204":
          description: Signed out.

  /v1/admin/me:
    get:
      operationId: getMe
      summary: The signed-in user, their organization and its shops.
      responses:
        "200":
          description: Who is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"

  /v1/admin/catalog:
    get:
      operationId: getCatalog
      summary: The whole menu of the organization.
      responses:
        "200":
          description: The menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "401":
          $ref: "#/components/responses/Error"

  /v1/admin/categories:
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Added, at the end.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/Error"
  /v1/admin/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCategory
      summary: Deletes a category. It must have no items left.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/categories/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Move"
      responses:
        "204":
          description: Moved.
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Added, at the end of its category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
  /v1/admin/items/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteItem
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/items/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveItem
      summary: Moves an item within its category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Move"
      responses:
        "204":
          description: Moved.
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/modifier-groups:
    post:
      operationId: createModifierGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierGroupInput"
      responses:
        "201":
          description: Added, at the end.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierGroup"
        "400":
          $ref: "#/components/responses/Error"
  /v1/admin/modifier-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateModifierGroup
      summary: Saves a group with its modifiers. Modifiers left out are deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierGroupInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierGroup"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteModifierGroup
      summary: Deletes a group, and takes it off the items that had it.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/modifier-groups/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveModifierGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Move"
      responses:
        "204":
          description: Moved.
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/staff:
    get:
      operationId: listStaff
      summary: The till staff of the organization, who sign in to tills with PINs.
      responses:
        "200":
          description: The staff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"
    post:
      operationId: createStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Added. They choose their own PIN at their first sign-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/staff/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateStaff
      summary: Saves a person. A PIN given becomes their new starting PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/admin/terminals:
    get:
      operationId: listTerminals
      summary: The tills of the organization's shops.
      responses:
        "200":
          description: The tills.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Terminal"
    post:
      operationId: createTerminal
      summary: Adds a till to a shop, with a pairing code to enter on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalInput"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalPairing"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/terminals/{id}/pairing-code:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: createPairingCode
      summary: A new pairing code for a till. Pairing with it replaces the till's device.
      responses:
        "200":
          description: The code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalPairing"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/terminals/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: unpairTerminal
      summary: Unpairs a till. Its device token stops working at once.
      responses:
        "204":
          description: Unpaired.
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/reports/sales:
    get:
      operationId: getSalesReport
      summary: |
        What the shops took between two business dates, both included, at
        most 366 days apart. Sales and refunds count on the business day the
        till had open, as on its own day report.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LocalDate"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LocalDate"
        - name: shopId
          in: query
          description: One shop. Without it, every shop of the organization.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/reports/usage:
    get:
      operationId: getUsage
      summary: |
        Each ingredient, between two dates: what was bought, and what sales
        used by today's recipes. Sales count on their business day;
        purchases on their date.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LocalDate"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LocalDate"
        - name: shopId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/purchases:
    get:
      operationId: listPurchases
      summary: |
        The purchases between two dates, both included, at most 366 days
        apart, latest first, with what was bought per area against that
        area's sales.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LocalDate"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LocalDate"
        - name: shopId
          in: query
          description: One shop. Without it, every shop of the organization.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseList"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPurchase
      summary: Records a purchase, adding its supplier and new products as it goes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/purchases/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updatePurchase
      summary: Saves a purchase; its lines are replaced by those given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePurchase
      summary: Deletes a purchase. It is kept, marked deleted, for the record.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/suppliers:
    get:
      operationId: listSuppliers
      summary: The organization's suppliers, by name.
      responses:
        "200":
          description: The suppliers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
  /v1/admin/suppliers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateSupplier
      summary: Whether a supplier's overdue invoices are warned of, and if it is quiet until a date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/products:
    get:
      operationId: listProducts
      summary: What the organization buys, by name, with what its latest purchase paid.
      responses:
        "200":
          description: The products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /v1/admin/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateProduct
      summary: Saves a product's name, area, ingredient and pack size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/ingredients:
    get:
      operationId: listIngredients
      summary: What recipes use, by name, each with its price per unit from recent purchases.
      responses:
        "200":
          description: The ingredients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ingredient"
    post:
      operationId: createIngredient
      summary: Adds an ingredient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientInput"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/ingredients/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateIngredient
      summary: Saves an ingredient's name and unit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteIngredient
      summary: Deletes an ingredient. Its products stay, belonging to none.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/recipes:
    get:
      operationId: getRecipes
      summary: Every recipe, of items, options and batches, with what each costs now.
      responses:
        "200":
          description: The recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipes"
  /v1/admin/items/{id}/recipe:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setItemRecipe
      summary: Sets what goes into an item; no lines for no recipe, back to a typed cost.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRecipe"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/modifiers/{id}/recipe:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setModifierRecipe
      summary: Sets how an option changes its item's recipe; amounts may be below 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierRecipe"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/batches:
    post:
      operationId: createBatch
      summary: Adds a batch, as the chef's big cook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInput"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/batches/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateBatch
      summary: Saves a batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBatch
      summary: Deletes a batch no recipe uses.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/terminal/pair:
    post:
      operationId: pairTerminal
      summary: Pairs a till with a code from the admin, giving it its device token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: Paired. Keep the token secret; it is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /v1/terminal/changes:
    get:
      operationId: getChanges
      summary: The menu and the shop's staff changed since a version; everything from 0.
      security:
        - device: []
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changes"
        "401":
          $ref: "#/components/responses/Error"

  /v1/terminal/events:
    post:
      operationId: sendEvents
      summary: What happened on the till, in the order it happened. Applied once each.
      security:
        - device: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
      responses:
        "200":
          description: |
            The events taken, in order. Processing stops at the first event that
            can't be taken, which `rejected` explains; the till sends it and those
            after it again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cafedesk_session
    device:
      type: http
      scheme: bearer
      description: A till's device token, from pairing.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: For programs, e.g. "invalid", "not_found", "conflict", "unauthorized".
            message:
              type: string
              description: For people, in a sentence.
            field:
              type: string
              description: The input field at fault, if one is.

    Ping:
      type: object
      required: [status, version, serverTime]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        serverTime:
          type: string
          format: date-time

    SignIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Me:
      type: object
      required: [user, organization, shops]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
        shops:
          type: array
          items:
            $ref: "#/components/schemas/Shop"

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, manager]

    Organization:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Shop:
      type: object
      required: [id, name, currency, timezone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        timezone:
          type: string

    Move:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          description: The new place, from 0. Past the end means last.

    Catalog:
      type: object
      required: [version, categories, items, modifierGroups]
      properties:
        version:
          type: integer
          format: int64
          description: Goes up with every change to the menu.
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        modifierGroups:
          type: array
          items:
            $ref: "#/components/schemas/ModifierGroup"

    CategoryInput:
      type: object
      required: [name, color, kitchen]
      properties:
        name:
          type: string
        nameAr:
          type: string
        color:
          type: string
          description: The signage band, as "#RRGGBB".
        kitchen:
          type: boolean
          description: New items of the category print on the kitchen ticket.
    Category:
      allOf:
        - $ref: "#/components/schemas/CategoryInput"
        - type: object
          required: [id, position, nameAr]
          properties:
            id:
              type: string
              format: uuid
            position:
              type: integer

    ItemInput:
      type: object
      required: [categoryId, name, priceFils, kitchen, modifierGroupIds, costFils]
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        nameAr:
          type: string
        priceFils:
          type: integer
          format: int64
          minimum: 0
        kitchen:
          type: boolean
          description: Prints on the kitchen ticket.
        costFils:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            What one costs the shop to make or buy, or null for not known.
            Admin only: tills never get it. A change applies to sales from
            now on, except an item's first cost, which applies to its earlier
            sales too, as they had none.
        modifierGroupIds:
          type: array
          description: The item's option groups, in order.
          items:
            type: string
            format: uuid
    Item:
      allOf:
        - $ref: "#/components/schemas/ItemInput"
        - type: object
          required: [id, position, nameAr, costFromRecipe]
          properties:
            id:
              type: string
              format: uuid
            position:
              type: integer
            costFromRecipe:
              type: boolean
              description: Its cost comes from its recipe; a costFils sent is then ignored.

    ModifierInput:
      type: object
      required: [name, priceDeltaFils, isDefault, costFils]
      properties:
        id:
          type: string
          format: uuid
          description: Set to keep an existing modifier; left out for a new one.
        name:
          type: string
        nameAr:
          type: string
        priceDeltaFils:
          type: integer
          format: int64
          description: Added to the item's price.
        isDefault:
          type: boolean
          description: Chosen when the item is tapped.
        costFils:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            What it adds to the cost of the item, as an extra parotta does,
            or null for nothing known (counted as nothing). Applies as an
            item's cost does.
    Modifier:
      allOf:
        - $ref: "#/components/schemas/ModifierInput"
        - type: object
          required: [id, position, nameAr, costFromRecipe]
          properties:
            costFromRecipe:
              type: boolean
              description: Its cost comes from its recipe; a costFils sent is then ignored.
            position:
              type: integer

    ModifierGroupInput:
      type: object
      required: [name, multiple, modifiers]
      properties:
        name:
          type: string
        nameAr:
          type: string
        multiple:
          type: boolean
          description: Several may be chosen, as extras; else exactly one, as a sugar level.
        modifiers:
          type: array
          items:
            $ref: "#/components/schemas/ModifierInput"
    ModifierGroup:
      type: object
      required: [id, name, nameAr, multiple, position, modifiers]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameAr:
          type: string
        multiple:
          type: boolean
        position:
          type: integer
        modifiers:
          type: array
          items:
            $ref: "#/components/schemas/Modifier"

    StaffRole:
      type: string
      enum: [cashier, manager]
      description: Managers also approve voids, refunds and closing the day on the till.

    StaffInput:
      type: object
      required: [name, role, shopIds, active]
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        shopIds:
          type: array
          description: The shops whose tills they can sign in to.
          items:
            type: string
            format: uuid
        active:
          type: boolean
          description: Whether they can sign in.
        pin:
          type: string
          description: |
            A starting PIN of 4 digits: required for a new person, and on a save
            it replaces their PIN. They choose their own at their next sign-in.
    Staff:
      type: object
      required: [id, name, role, shopIds, active, mustChangePin]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        shopIds:
          type: array
          items:
            type: string
            format: uuid
        active:
          type: boolean
        mustChangePin:
          type: boolean
          description: They still have a starting PIN.

    TerminalInput:
      type: object
      required: [shopId]
      properties:
        shopId:
          type: string
          format: uuid
        name:
          type: string
          description: Where it stands, e.g. "Front counter".
    Terminal:
      type: object
      required: [id, shopId, code, name, status]
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        code:
          type: string
          description: Prefixes its order numbers, e.g. "T1".
        name:
          type: string
        status:
          type: string
          enum: [waiting, paired, unpaired]
          description: Waiting for its first pairing, paired, or unpaired in the admin.
        pairedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: When it last reached the server.
    TerminalPairing:
      type: object
      required: [terminal, code, expiresAt]
      properties:
        terminal:
          $ref: "#/components/schemas/Terminal"
        code:
          type: string
          description: 8 digits to enter on the till, usable once.
        expiresAt:
          type: string
          format: date-time

    LocalDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: A date in the shop's own time, YYYY-MM-DD.
    SalesReport:
      type: object
      required: [from, to, totals, days, hours, items, tills, staff, closes]
      properties:
        from:
          $ref: "#/components/schemas/LocalDate"
        to:
          $ref: "#/components/schemas/LocalDate"
        totals:
          $ref: "#/components/schemas/SalesTotals"
        days:
          type: array
          description: Every date from `from` to `to`, days without sales too.
          items:
            $ref: "#/components/schemas/DaySales"
        hours:
          type: array
          description: All 24 hours of the clock, in the shop's time, over the whole range.
          items:
            $ref: "#/components/schemas/HourSales"
        items:
          type: array
          description: What sold, most taken first.
          items:
            $ref: "#/components/schemas/ItemSales"
        tills:
          type: array
          items:
            $ref: "#/components/schemas/TillSales"
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffSales"
        closes:
          type: array
          description: Each till's business days, latest first, with their cash counts.
          items:
            $ref: "#/components/schemas/DayClose"
    SalesTotals:
      type: object
      required: [orders, grossFils, cashFils, cardFils, refunds, refundsFils, refundsCashFils, voids, voidsFils, netFils,
        costFils, profitFils, uncostedFils]
      properties:
        orders:
          type: integer
          description: Completed orders; voided ones aren't sales.
        grossFils:
          type: integer
          format: int64
        cashFils:
          type: integer
          format: int64
        cardFils:
          type: integer
          format: int64
        refunds:
          type: integer
        refundsFils:
          type: integer
          format: int64
        refundsCashFils:
          type: integer
          format: int64
        voids:
          type: integer
        voidsFils:
          type: integer
          format: int64
        netFils:
          type: integer
          format: int64
          description: Sales less refunds.
        costFils:
          type: integer
          format: int64
          description: What the sales with a known cost cost.
        profitFils:
          type: integer
          format: int64
          description: |
            Sales with a known cost, less their refunds, less what they cost.
            Sales of items without a cost aren't in it.
        uncostedFils:
          type: integer
          format: int64
          description: Sales of items without a cost, left out of the profit.
    DaySales:
      type: object
      required: [date, orders, grossFils, refundsFils, netFils]
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        orders:
          type: integer
        grossFils:
          type: integer
          format: int64
        refundsFils:
          type: integer
          format: int64
        netFils:
          type: integer
          format: int64
    HourSales:
      type: object
      required: [hour, orders, grossFils]
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        orders:
          type: integer
        grossFils:
          type: integer
          format: int64
    ItemSales:
      type: object
      required: [itemId, name, qty, grossFils]
      properties:
        itemId:
          type: string
        name:
          type: string
          description: The name it last sold under.
        qty:
          type: integer
        grossFils:
          type: integer
          format: int64
        costFils:
          type: integer
          format: int64
          description: What they cost; missing when the item had no cost for some of these sales.
    TillSales:
      type: object
      required: [terminalId, code, name, orders, grossFils, refundsFils, netFils]
      properties:
        terminalId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        orders:
          type: integer
        grossFils:
          type: integer
          format: int64
        refundsFils:
          type: integer
          format: int64
        netFils:
          type: integer
          format: int64
    StaffSales:
      type: object
      required: [staffId, name, orders, grossFils]
      properties:
        staffId:
          type: string
          format: uuid
        name:
          type: string
        orders:
          type: integer
        grossFils:
          type: integer
          format: int64
    DayClose:
      type: object
      required: [id, date, terminalCode, terminalName, openedAt, openedByName, floatFils, cashSalesFils, cashRefundsFils, expectedFils]
      properties:
        id:
          type: string
          format: uuid
        date:
          $ref: "#/components/schemas/LocalDate"
        terminalCode:
          type: string
        terminalName:
          type: string
        openedAt:
          type: string
          format: date-time
        openedByName:
          type: string
        closedAt:
          type: string
          format: date-time
          description: Missing while the day is open, or its close hasn't been sent yet.
        closedByName:
          type: string
        floatFils:
          type: integer
          format: int64
        cashSalesFils:
          type: integer
          format: int64
        cashRefundsFils:
          type: integer
          format: int64
        expectedFils:
          type: integer
          format: int64
          description: The float, plus cash sales, less cash refunds.
        countedFils:
          type: integer
          format: int64
        differenceFils:
          type: integer
          format: int64
          description: Counted less expected; below 0 is short.

    Area:
      type: string
      enum: [counter, kitchen, packaging, other]
      description: |
        Where a purchase goes: the counter (tea and drinks), the kitchen,
        packaging (cups, boxes, bags), or other.
    SupplierInput:
      type: object
      required: [watched, quietUntil]
      properties:
        watched:
          type: boolean
          description: Warn when its invoice is overdue. Off for an occasional supplier.
        quietUntil:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: No warning through this date, YYYY-MM-DD; null for none.
    Supplier:
      type: object
      required: [id, name, watched]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lastPurchasedOn:
          $ref: "#/components/schemas/LocalDate"
        usualDays:
          type: integer
          description: |
            How many days apart its purchases usually are: the median gap of
            its last six purchase dates. Missing until it has two.
        watched:
          type: boolean
        quietUntil:
          $ref: "#/components/schemas/LocalDate"
    Product:
      type: object
      required: [id, name, area]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: As the invoice names it, e.g. "Rainbow evaporated milk, 48 x 170 g".
        area:
          $ref: "#/components/schemas/Area"
        lastUnitPriceFils:
          type: integer
          format: int64
          description: The unit price of its latest purchase.
        lastQuantity:
          type: number
          format: double
          description: How many its latest purchase took.
        lastPurchasedOn:
          $ref: "#/components/schemas/LocalDate"
        code:
          type: string
          description: The supplier's code for it, as on its invoices.
        lastCostEachFils:
          type: number
          format: double
          description: What one cost in its latest purchase, as paid, VAT included.
        ingredientId:
          type: string
          format: uuid
          description: The ingredient it is, if it is one recipes use.
        packAmount:
          type: number
          format: double
          description: How much of its ingredient one holds, in the ingredient's unit, e.g. 8160 (g).
    ProductInput:
      type: object
      required: [name, area, ingredientId, packAmount]
      properties:
        name:
          type: string
        code:
          type: string
          description: The supplier's code; empty for none.
        area:
          $ref: "#/components/schemas/Area"
        ingredientId:
          type: string
          format: uuid
          nullable: true
        packAmount:
          type: number
          format: double
          nullable: true
          description: Up to 3 decimals; null when not known, or with no ingredient.
    Unit:
      type: string
      enum: [g, ml, piece]
    IngredientInput:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
          description: What recipes call it, e.g. "Evaporated milk".
        unit:
          $ref: "#/components/schemas/Unit"
    Ingredient:
      type: object
      required: [id, name, unit, products]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          $ref: "#/components/schemas/Unit"
        products:
          type: integer
          description: How many products are this ingredient.
        unitCostFils:
          type: number
          format: double
          description: |
            Fils per unit (per g, ml or piece), from the latest three purchase
            lines of its products that have a pack size, weighted by quantity.
            Missing until one is bought with a pack size known.
        pricedOn:
          $ref: "#/components/schemas/LocalDate"
    PurchaseLineInput:
      type: object
      required: [area, quantity, unitPriceFils, totalFils]
      properties:
        productId:
          type: string
          format: uuid
          description: A known product; or leave it out and give productName.
        productName:
          type: string
          description: A product by name, added if it is new.
        productCode:
          type: string
          description: |
            The supplier's code for the product. A known code names its
            product before the name does; a new product keeps it.
        vatFils:
          type: integer
          format: int64
          minimum: 0
          description: The VAT in totalFils, when the prices were before VAT.
        ingredientId:
          type: string
          format: uuid
          description: |
            The ingredient the product is, with packAmount: taken only if the
            product belongs to no ingredient yet, as a new one doesn't.
        packAmount:
          type: number
          format: double
          description: How much of the ingredient one holds, in its unit.
        area:
          $ref: "#/components/schemas/Area"
        quantity:
          type: number
          format: double
          description: Up to 3 decimals, e.g. 2, or 1.5 for kilos.
        unitPriceFils:
          type: integer
          format: int64
          minimum: 0
        totalFils:
          type: integer
          format: int64
          minimum: 0
          description: The line's amount, as the invoice has it.
    PurchaseLine:
      type: object
      required: [productId, productName, area, quantity, unitPriceFils, totalFils, vatFils]
      properties:
        productCode:
          type: string
        vatFils:
          type: integer
          format: int64
        productId:
          type: string
          format: uuid
        productName:
          type: string
        area:
          $ref: "#/components/schemas/Area"
        quantity:
          type: number
          format: double
        unitPriceFils:
          type: integer
          format: int64
        totalFils:
          type: integer
          format: int64
    PurchaseInput:
      type: object
      required: [shopId, date, lines]
      properties:
        shopId:
          type: string
          format: uuid
        date:
          $ref: "#/components/schemas/LocalDate"
        supplierId:
          type: string
          format: uuid
        supplierName:
          type: string
          description: A supplier by name, added if it is new. Neither, for a one-off from anywhere.
        reference:
          type: string
          description: The invoice or receipt number.
        pricesBeforeVat:
          type: boolean
          description: |
            The unit prices are before VAT, as a wholesaler's invoice has them;
            each line's total is what was paid, VAT included.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLineInput"
    Purchase:
      type: object
      required: [id, shopId, date, reference, totalFils, vatFils, pricesBeforeVat, lines, createdAt, createdByName]
      properties:
        vatFils:
          type: integer
          format: int64
          description: The VAT in totalFils.
        pricesBeforeVat:
          type: boolean
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        date:
          $ref: "#/components/schemas/LocalDate"
        supplier:
          $ref: "#/components/schemas/Supplier"
        reference:
          type: string
        totalFils:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLine"
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedByName:
          type: string
    PurchaseList:
      type: object
      required: [from, to, purchases, areas, totalFils, salesFils]
      properties:
        from:
          $ref: "#/components/schemas/LocalDate"
        to:
          $ref: "#/components/schemas/LocalDate"
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/Purchase"
        areas:
          type: array
          description: Every area, in order, with what was bought for it.
          items:
            $ref: "#/components/schemas/AreaSpend"
        totalFils:
          type: integer
          format: int64
          description: All that was bought.
        salesFils:
          type: integer
          format: int64
          description: Sales less refunds in the same dates, by business day.
    AreaSpend:
      type: object
      required: [area, boughtFils]
      properties:
        area:
          $ref: "#/components/schemas/Area"
        boughtFils:
          type: integer
          format: int64
        salesFils:
          type: integer
          format: int64
          description: |
            The area's own sales less refunds: the counter's are items not on
            the kitchen ticket, the kitchen's are items on it. Missing for
            packaging and other, which serve all sales.

    RecipeLine:
      type: object
      required: [amount]
      properties:
        ingredientId:
          type: string
          format: uuid
          description: An ingredient, in its unit; or a batchId.
        batchId:
          type: string
          format: uuid
          description: Portions of a batch; not in a batch's own recipe.
        amount:
          type: number
          format: double
          description: Up to 3 decimals; below 0 only in an option's recipe.
    RecipeInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/RecipeLine"
    RecipeCost:
      type: object
      required: [missing]
      properties:
        costFils:
          type: integer
          format: int64
          description: What its recipe costs now; missing while an ingredient has no price.
        missing:
          type: array
          description: The ingredients it uses that have no price yet.
          items:
            type: string
    ItemRecipe:
      allOf:
        - $ref: "#/components/schemas/RecipeCost"
        - type: object
          required: [itemId, lines]
          properties:
            itemId:
              type: string
              format: uuid
            lines:
              type: array
              items:
                $ref: "#/components/schemas/RecipeLine"
    ModifierRecipe:
      allOf:
        - $ref: "#/components/schemas/RecipeCost"
        - type: object
          required: [modifierId, lines]
          properties:
            modifierId:
              type: string
              format: uuid
            lines:
              type: array
              items:
                $ref: "#/components/schemas/RecipeLine"
    BatchInput:
      type: object
      required: [name, yieldPortions, lines]
      properties:
        name:
          type: string
          description: What the chef calls it, e.g. "Chicken curry base".
        yieldPortions:
          type: number
          format: double
          description: How many portions one batch makes.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/RecipeLine"
    Batch:
      allOf:
        - $ref: "#/components/schemas/RecipeCost"
        - type: object
          required: [id, name, yieldPortions, lines, usedBy]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            yieldPortions:
              type: number
              format: double
            lines:
              type: array
              items:
                $ref: "#/components/schemas/RecipeLine"
            portionCostFils:
              type: number
              format: double
              description: What one portion costs now, the batch's cost over its portions.
            usedBy:
              type: integer
              description: How many items and options use it.
    Recipes:
      type: object
      required: [items, modifiers, batches]
      properties:
        items:
          type: array
          description: The items that have a recipe.
          items:
            $ref: "#/components/schemas/ItemRecipe"
        modifiers:
          type: array
          description: The options that have one.
          items:
            $ref: "#/components/schemas/ModifierRecipe"
        batches:
          type: array
          items:
            $ref: "#/components/schemas/Batch"

    Usage:
      type: object
      required: [from, to, ingredients, boughtFils, usedFils, unsortedFils, unrecipedFils]
      properties:
        from:
          $ref: "#/components/schemas/LocalDate"
        to:
          $ref: "#/components/schemas/LocalDate"
        ingredients:
          type: array
          description: The ingredients bought or used, the largest difference in money first.
          items:
            $ref: "#/components/schemas/IngredientUsage"
        boughtFils:
          type: integer
          format: int64
          description: What the purchases of sorted products with pack sizes cost.
        usedFils:
          type: integer
          format: int64
          description: What sales used, by the recipes, at today's prices.
        unsortedFils:
          type: integer
          format: int64
          description: Purchases of products without an ingredient or pack size, not in boughtFils.
        unrecipedFils:
          type: integer
          format: int64
          description: Sales of items without a recipe, whose use is not in usedFils.
    IngredientUsage:
      type: object
      required: [ingredientId, name, unit, bought, used]
      properties:
        ingredientId:
          type: string
          format: uuid
        name:
          type: string
        unit:
          $ref: "#/components/schemas/Unit"
        bought:
          type: number
          format: double
          description: How much was bought, in its unit.
        used:
          type: number
          format: double
          description: How much sales used, by the recipes, in its unit.
        unitCostFils:
          type: number
          format: double
          description: Its price per unit now; missing while it has none.

    PairRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    Pairing:
      type: object
      required: [token, organization, shop, terminal]
      properties:
        token:
          type: string
        organization:
          $ref: "#/components/schemas/Organization"
        shop:
          $ref: "#/components/schemas/Shop"
        terminal:
          $ref: "#/components/schemas/Terminal"

    Changes:
      type: object
      required: [version, full, categories, items, modifierGroups, staff]
      description: |
        Rows changed after `since`, deleted ones with `archived` set. When `full`
        is set (since was 0), they are the whole menu and staff, and anything the
        till has that isn't among them is gone.
      properties:
        version:
          type: integer
          format: int64
          description: Ask for changes since this next time.
        full:
          type: boolean
        categories:
          type: array
          items:
            $ref: "#/components/schemas/SyncCategory"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SyncItem"
        modifierGroups:
          type: array
          items:
            $ref: "#/components/schemas/SyncModifierGroup"
        staff:
          type: array
          items:
            $ref: "#/components/schemas/SyncStaff"
    SyncCategory:
      type: object
      required: [id, name, nameAr, color, position, kitchen, archived]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameAr:
          type: string
        color:
          type: string
        position:
          type: integer
        kitchen:
          type: boolean
        archived:
          type: boolean
    SyncItem:
      type: object
      required: [id, categoryId, name, nameAr, priceFils, position, kitchen, modifierGroupIds, archived]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        nameAr:
          type: string
        priceFils:
          type: integer
          format: int64
        position:
          type: integer
        kitchen:
          type: boolean
        modifierGroupIds:
          type: array
          items:
            type: string
            format: uuid
        archived:
          type: boolean
    SyncModifierGroup:
      type: object
      required: [id, name, nameAr, multiple, position, archived, modifiers]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameAr:
          type: string
        multiple:
          type: boolean
        position:
          type: integer
        archived:
          type: boolean
        modifiers:
          type: array
          description: All of the group's modifiers, deleted ones archived.
          items:
            $ref: "#/components/schemas/SyncModifier"
    SyncModifier:
      type: object
      required: [id, name, nameAr, priceDeltaFils, isDefault, position, archived]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameAr:
          type: string
        priceDeltaFils:
          type: integer
          format: int64
        isDefault:
          type: boolean
        position:
          type: integer
        archived:
          type: boolean
    SyncStaff:
      type: object
      required: [id, name, role, pinHash, mustChangePin, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        pinHash:
          type: string
          description: The PIN's Argon2id hash, which the till checks PINs against.
        mustChangePin:
          type: boolean
        active:
          type: boolean
          description: False for someone turned off, or no longer on this shop's tills.

    EventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Event"
    EventResult:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: array
          description: The seq of each event taken.
          items:
            type: integer
            format: int64
        rejected:
          $ref: "#/components/schemas/EventRejection"
    EventRejection:
      type: object
      required: [seq, message]
      properties:
        seq:
          type: integer
          format: int64
        message:
          type: string
    Event:
      type: object
      required: [seq, type]
      description: One thing that happened on the till; the field named by `type` holds it.
      properties:
        seq:
          type: integer
          format: int64
          description: The till's number for the event, increasing.
        type:
          type: string
          enum: [business_day, order, order_void, refund, staff_pin]
        businessDay:
          $ref: "#/components/schemas/BusinessDayEvent"
        order:
          $ref: "#/components/schemas/OrderEvent"
        orderVoid:
          $ref: "#/components/schemas/OrderVoidEvent"
        refund:
          $ref: "#/components/schemas/RefundEvent"
        staffPin:
          $ref: "#/components/schemas/StaffPinEvent"
    BusinessDayEvent:
      type: object
      required: [id, date, openedAt, openedBy, openedByName, openingFloatFils]
      description: A day as it stands, opened or closed.
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          description: The local date it was opened on, YYYY-MM-DD.
        openedAt:
          type: string
          format: date-time
        openedBy:
          type: string
          format: uuid
        openedByName:
          type: string
        openingFloatFils:
          type: integer
          format: int64
        closedAt:
          type: string
          format: date-time
        closedBy:
          type: string
          format: uuid
        closedByName:
          type: string
        countedCashFils:
          type: integer
          format: int64
    OrderEvent:
      type: object
      required: [id, businessDayId, number, code, createdAt, staffId, staffName, totalFils, paymentMethod,
        tenderedFils, changeFils, lines]
      properties:
        id:
          type: string
          format: uuid
        businessDayId:
          type: string
          format: uuid
        number:
          type: integer
        code:
          type: string
        createdAt:
          type: string
          format: date-time
        staffId:
          type: string
          format: uuid
        staffName:
          type: string
        totalFils:
          type: integer
          format: int64
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        tenderedFils:
          type: integer
          format: int64
        changeFils:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineEvent"
    PaymentMethod:
      type: string
      enum: [cash, card]
    OrderLineEvent:
      type: object
      required: [id, itemId, name, qty, unitPriceFils, lineTotalFils, kitchen, modifiers]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          description: The menu item's ID, as the till had it.
        name:
          type: string
        qty:
          type: integer
        unitPriceFils:
          type: integer
          format: int64
          description: With its modifiers.
        lineTotalFils:
          type: integer
          format: int64
        kitchen:
          type: boolean
        modifiers:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineModifierEvent"
    OrderLineModifierEvent:
      type: object
      required: [groupId, groupName, modifierId, name, priceDeltaFils, isDefault]
      properties:
        groupId:
          type: string
        groupName:
          type: string
        modifierId:
          type: string
        name:
          type: string
        priceDeltaFils:
          type: integer
          format: int64
        isDefault:
          type: boolean
    OrderVoidEvent:
      type: object
      required: [orderId, voidedAt, voidedBy, voidedByName, reason]
      properties:
        orderId:
          type: string
          format: uuid
        voidedAt:
          type: string
          format: date-time
        voidedBy:
          type: string
          format: uuid
        voidedByName:
          type: string
        reason:
          type: string
    RefundEvent:
      type: object
      required: [id, orderId, businessDayId, createdAt, staffId, staffName, approvedBy, approvedByName, reason,
        method, totalFils, lines]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        businessDayId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        staffId:
          type: string
          format: uuid
        staffName:
          type: string
        approvedBy:
          type: string
          format: uuid
        approvedByName:
          type: string
        reason:
          type: string
        method:
          $ref: "#/components/schemas/PaymentMethod"
        totalFils:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: "#/components/schemas/RefundLineEvent"
    RefundLineEvent:
      type: object
      required: [orderLineId, qty, amountFils]
      properties:
        orderLineId:
          type: string
          format: uuid
        qty:
          type: integer
        amountFils:
          type: integer
          format: int64
    StaffPinEvent:
      type: object
      required: [staffId, previousPinHash, pinHash, changedAt]
      description: |
        A PIN chosen at the till. It is taken only if the person's PIN is still
        previousPinHash: a starting PIN set in the admin meanwhile wins.
      properties:
        staffId:
          type: string
          format: uuid
        previousPinHash:
          type: string
          description: The hash of the PIN it replaces, as the till had it.
        pinHash:
          type: string
        changedAt:
          type: string
          format: date-time
